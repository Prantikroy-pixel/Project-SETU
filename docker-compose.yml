version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: setu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-setu}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-setu_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-setu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: setu_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-setu-platform-secret-key-2026-production-ready}
      - ALLOWED_HOSTS=*
      - DB_NAME=${DB_NAME:-setu}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-setu_secure_password_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - JWT_ACCESS_TOKEN_LIFETIME_MIN=60
      - MEDIA_ROOT=/app/backend/media
    volumes:
      - backend_media:/app/backend/media
      - backend_static:/app/backend/staticfiles
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: setu_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: setu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_media:/app/media:ro
      - backend_static:/app/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_media:
  backend_static:
